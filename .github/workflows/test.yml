name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # zip: the epub layout step shells out to it. ffmpeg: probeSecs and the
      # duration fixtures. The aligner's python venv is NOT needed here — the
      # unit suite never runs the acoustic model.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip
      - run: pnpm install --frozen-lockfile
      # Format + lint, including the no-`let` / no-parameter-reassign rules
      # the source's immutability convention rests on.
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:coverage
      # The python half is locked too, because torchaudio *is* the model (see
      # the README's "Reproducing an alignment"). Nothing is installed here —
      # 2GB of torch for a suite that never runs the acoustic model — this only
      # re-derives uv.lock and its pip-shaped export from pyproject.toml, so a
      # pin edited without a re-lock, or a lock edited without an export, can't
      # merge. `uv lock` keeps existing pins that still satisfy the spec, so an
      # unrelated upstream release doesn't turn this red.
      - uses: astral-sh/setup-uv@v10.1.0
      - run: pnpm py:lock
      - run: git diff --exit-code uv.lock requirements.lock
